services:
  # ─── Backend: Express API ─────────────────────────────────────
  loko-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SERVER_PORT=4000
    expose:
      - "4000"
    volumes:
      - loko-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Frontend: serve (static) ─────────────────────────────────
  loko-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      loko-backend:
        condition: service_healthy

volumes:
  loko-uploads:
