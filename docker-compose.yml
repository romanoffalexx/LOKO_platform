services:
  # ─── Backend: Express API ─────────────────────────────────────
  loko-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loko-backend
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: "production"
      DATABASE_URL: ${DATABASE_URL}
      SERVER_PORT: "4000"
      SESSION_SECRET: ${SESSION_SECRET}
      MASTER_EMAIL: ${MASTER_EMAIL}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-LOKO Platform <notifications@loko.ru>}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - loko-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Frontend: статика (serve) ────────────────────────────────
  loko-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: loko-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      loko-backend:
        condition: service_healthy

volumes:
  loko-uploads:
