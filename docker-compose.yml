# LOKO Platform — единый Docker Compose для Dokploy
# Оба контейнера в одной сети, nginx проксирует /api → backend
# В Dokploy: один Compose проект, домен на loko-frontend:3000

services:
  # ─── Backend: Express API ─────────────────────────────────────
  loko-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loko-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - SERVER_PORT=4000
    expose:
      - "4000"
    volumes:
      - loko-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Frontend: Nginx (статика + прокси /api) ──────────────────
  loko-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api
        - VITE_YANDEX_MAPS_KEY=${VITE_YANDEX_MAPS_KEY}
        - VITE_YANDEX_MAPS_GEOCODER_KEY=${VITE_YANDEX_MAPS_GEOCODER_KEY}
    container_name: loko-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      loko-backend:
        condition: service_healthy

volumes:
  loko-uploads:
    driver: local
