# Docker Compose для Frontend (отдельный деплой в Dokploy)
# Nginx раздаёт статику и проксирует /api → loko-backend по общей сети
# Домен в Dokploy привязывается к сервису loko-frontend, порт 3000

services:
  loko-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=/api
        - VITE_YANDEX_MAPS_KEY=${VITE_YANDEX_MAPS_KEY}
        - VITE_YANDEX_MAPS_GEOCODER_KEY=${VITE_YANDEX_MAPS_GEOCODER_KEY}
    container_name: loko-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - loko_net

networks:
  loko_net:
    name: loko_net
    driver: bridge
    external: true
